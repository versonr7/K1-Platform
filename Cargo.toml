[workspace]
members = ["za-app", "za-gles", "za-math", "za-sys", "za-xmb"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["versonr7"]
license = "GPL-3.0-only"
repository = "https://github.com/versonr7/ZAVOGLES-GUI"

[workspace.dependencies]
# Math
za-math = { path = "za-math" }

# System
za-sys = { path = "za-sys" }

[profile.release]
opt-level = 3
panic = "abort"
#lto = "fat"
#codegen-units = 1
#strip = true
# panic strategy: default is unwind, but our dummy symbols handle Android

[profile.dev]
opt-level = 1
panic = "abort"
# panic strategy: default is unwind
