name: Build Android (cargo-apk2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Install cargo-apk2 via cargo-binstall
        run: |
          if ! command -v cargo-apk2 &> /dev/null; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | sh
            cargo binstall --no-confirm cargo-apk2
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true
          local-cache: true  # هذي العامل الأساسي في التسريع

      - name: Build Debug APK
        run: cargo apk2 build -p k1-app
        env:
          RUSTFLAGS: "-C codegen-units=256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k1-debug-apk
          path: target/debug/apk/*.apk