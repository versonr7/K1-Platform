<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZAVOGLES-GUI Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
}

/* ===== Animated Background ===== */
.bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a0e1a 0%, #0d1220 50%, #080c18 100%);
    animation: bgPulse 4s ease-in-out infinite;
}
@keyframes bgPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.05); }
}

/* ===== Wave Band ===== */
.wave {
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    height: 25%;
    background: rgba(30, 60, 120, 0.4);
    overflow: hidden;
}
.wave::before {
    content: '';
    position: absolute;
    left: -100%; right: -100%;
    top: 0; bottom: 0;
    background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        rgba(60, 120, 200, 0.3) 2px,
        transparent 4px
    );
    animation: waveMove 3s linear infinite;
}
@keyframes waveMove {
    0% { transform: translateX(0) skewY(2deg); }
    50% { transform: translateX(50px) skewY(-2deg); }
    100% { transform: translateX(0) skewY(2deg); }
}

/* ===== XMB Container ===== */
.xmb {
    position: absolute;
    left: 0; right: 0;
    top: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8vw;
    transform: translateY(-50%);
}

/* ===== Category Button ===== */
.cat {
    position: relative;
    width: 22vw;
    height: 10vh;
    min-width: 120px;
    min-height: 60px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px, 3vw, 24px);
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.6);
    background: rgba(20, 50, 100, 0.5);
    border: 2px solid rgba(60, 140, 255, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    user-select: none;
    overflow: hidden;
}
.cat::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(60,140,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.3s;
}
.cat:hover::before, .cat.selected::before {
    opacity: 1;
}

/* Selected State */
.cat.selected {
    background: rgba(60, 140, 255, 0.9);
    color: #fff;
    border-color: rgba(100, 180, 255, 0.8);
    box-shadow: 0 0 30px rgba(60, 140, 255, 0.4),
                0 8px 32px rgba(0, 0, 0, 0.4);
    transform: scale(1.08);
    z-index: 10;
}

/* Unselected dim */
.cat:not(.selected) {
    opacity: 0.6;
    transform: scale(0.95);
}

/* Arabic text support */
.cat[dir="rtl"] {
    font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
}

/* ===== Touch hint ===== */
.hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    text-align: center;
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wave"></div>

<div class="xmb" id="xmb">
    <div class="cat" data-index="0">Settings</div>
    <div class="cat selected" data-index="1">Games</div>
    <div class="cat" data-index="2">Media</div>
</div>

<div class="hint">Tap left/right to navigate • Center to select</div>

<script>
const cats = document.querySelectorAll('.cat');
let selected = 1;

function update() {
    cats.forEach((c, i) => {
        c.classList.toggle('selected', i === selected);
    });
}

// Touch / Click handling
document.addEventListener('touchstart', handleTouch, {passive: false});
document.addEventListener('click', handleClick);

function handleTouch(e) {
    e.preventDefault();
    const x = e.touches[0].clientX;
    const w = window.innerWidth;
    if (x < w * 0.33) selected = Math.max(0, selected - 1);
    else if (x > w * 0.66) selected = Math.min(2, selected + 1);
    update();
}

function handleClick(e) {
    if (e.target.classList.contains('cat')) {
        selected = parseInt(e.target.dataset.index);
        update();
    }
}

// Keyboard support
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') selected = Math.max(0, selected - 1);
    if (e.key === 'ArrowRight') selected = Math.min(2, selected + 1);
    update();
});

update();
</script>
</body>
</html>
